<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalifai · App</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalifai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script>if(location.hash&&location.hash.length>1)location.replace('herramientas.html'+location.hash)</script>
<style>
:root{--gold:#FFCB45;--amber:#FFD54F;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:400 16px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.grid{position:fixed;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none;padding:0 16px}.grid i{border-left:1px solid var(--line)}.grid i:last-child{border-right:1px solid var(--line)}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.7);backdrop-filter:blur(10px)}
.top svg{width:34px;height:34px}.top b{font:700 17px var(--sans);letter-spacing:.3em}.top .sp{flex:1}
.top a.web{font:500 11px var(--mono);letter-spacing:.3em;border:1px solid var(--line2);padding:10px 14px}
.hero{position:absolute;top:calc(env(safe-area-inset-top) + 86px);left:0;right:0;text-align:center;z-index:5;pointer-events:none}
.lbl{font:500 11px var(--mono);letter-spacing:.4em;color:var(--gold);text-transform:uppercase}
.hero h1{margin:10px 0 0;font:700 clamp(28px,7vw,54px)/1 var(--sans);text-transform:uppercase}
.hero p{margin:10px auto 0;color:#9b9b9b;font:500 11px var(--mono);letter-spacing:.3em;text-transform:uppercase}
/* Carrusel 3D */
.stage{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 45%;touch-action:none}
.ring{position:absolute;left:50%;top:60%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.card{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;left:calc(var(--w)/-2);top:calc(var(--h)/-2);width:var(--w);height:var(--h);transform-style:preserve-3d;border:1px solid var(--line2);background:#050505;overflow:hidden;cursor:pointer;transition:border-color .4s,box-shadow .4s}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) contrast(1.1)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,0) 40%,rgba(0,0,0,.9))}
.card .c{position:absolute;inset:0;z-index:2;padding:22px;display:flex;flex-direction:column}
.card .n{font:500 12px var(--mono);letter-spacing:.3em;color:var(--gold)}
.card h3{margin:auto 0 8px;font:700 22px/1.1 var(--sans);text-transform:uppercase}
.card small{font:500 10px var(--mono);letter-spacing:.3em;color:#cfcfcf;text-transform:uppercase}
.card.front{border-color:var(--gold);box-shadow:0 0 60px rgba(255,203,69,.25)}
.card.tools{background:#111}.card.tools::after{display:none}
.ctrl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;justify-content:center;gap:14px;z-index:6}
.ctrl button{width:52px;height:52px;border:1px solid var(--line2);background:rgba(0,0,0,.6);font-size:20px}
.ctrl .open{width:auto;padding:0 26px;background:var(--amber);border-color:var(--amber);color:#000;font:700 12px var(--mono);letter-spacing:.3em;text-transform:uppercase}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(0,0,0,.85);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.dock a{padding:18px 6px;text-align:center;font:500 10px var(--mono);letter-spacing:.25em;text-transform:uppercase;color:#cfcfcf;border-right:1px solid var(--line)}.dock a:last-child{border-right:0}.dock a b{display:block;color:var(--gold);font-size:16px;margin-bottom:4px;font-weight:500}
/* Ventanas 3D */
.wins{position:fixed;inset:0;z-index:40;pointer-events:none;perspective:1400px}
.win{position:absolute;inset:0;background:#000;pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;transform-origin:50% 50%;opacity:0;transform:translateZ(-600px) rotateX(18deg);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}
.win.in{opacity:1;transform:none}
.win.back{pointer-events:none;opacity:.25;transform:translateZ(-300px) rotateY(18deg) translateX(-12%)}
.win.out{opacity:0;transform:translateX(30%) rotateY(-30deg)}
.win .hd{position:relative;height:46vh;min-height:300px;overflow:hidden}
.win .hd video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6) contrast(1.1)}
.win .hd.nov::after{display:none}.win .hd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 40%,#000)}
.win .hd .t{position:absolute;left:22px;right:22px;bottom:22px;z-index:2}
.win h2{margin:12px 0 0;font:700 clamp(30px,8vw,56px)/1 var(--sans);text-transform:uppercase}
.win .x{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:5;height:46px;padding:0 16px;border:1px solid var(--line2);background:rgba(0,0,0,.7);font:500 11px var(--mono);letter-spacing:.3em}
.win .bd{padding:26px 22px calc(env(safe-area-inset-bottom) + 40px);max-width:760px;margin:0 auto}
.win .lead{color:#bdbdbd;font-size:18px;margin:0 0 26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;border:1px solid var(--line2);background:#070707;padding:20px 18px 18px;min-height:132px;display:flex;flex-direction:column;transform-style:preserve-3d;transition:transform .35s,border-color .35s}
.tile:hover,.tile:active{transform:translateZ(20px) rotateX(4deg);border-color:var(--gold)}
.tile span{font:500 10px var(--mono);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.tile b{margin-top:auto;font:700 18px/1.15 var(--sans);text-transform:uppercase}
.tile.wide{grid-column:1/-1;background:var(--amber);border-color:var(--amber);color:#000;min-height:80px}.tile.wide span{color:#000}
.list{border-top:1px solid var(--line2)}.list div{padding:18px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:44px 1fr}
.list em{font:500 12px var(--mono);color:var(--gold);font-style:normal;padding-top:3px}.list b{display:block;font:700 17px var(--sans);text-transform:uppercase}.list p{margin:6px 0 0;color:#a9a9a9}
.price{margin:26px 0;padding:22px;border:1px solid var(--gold)}.price b{display:block;font:700 30px var(--sans)}.price span{font:500 11px var(--mono);letter-spacing:.3em;color:var(--gold)}
.btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:14px;padding:20px 22px;border:1px solid #fff;background:#fff;color:#000;font:700 12px var(--mono);letter-spacing:.3em;text-transform:uppercase}
.btn.o{background:transparent;color:#fff;border-color:var(--line2)}
/* Estudio Kalifai (freemium) */
.hero .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px;padding:0 12px}
.hero .acts button{pointer-events:auto;margin:0!important;height:38px!important;padding:0 14px!important;font-size:10px!important;letter-spacing:.22em!important}
.std{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid #fff;background:linear-gradient(90deg,#FFCB45,#FFD54F);color:#000;font:700 10px var(--mono);letter-spacing:.22em;text-transform:uppercase}
.stdbox{display:grid;gap:16px}
.cvwrap{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;border:1px solid var(--line2);background:#050505;overflow:hidden}
.cvwrap canvas{width:100%;height:100%;display:block}
.reel{position:absolute;inset:0;display:none;z-index:3;background:#000}.reel.on{display:block}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.reel .rt{position:absolute;left:8%;right:8%;top:38%;font:700 26px/1.1 var(--sans);text-transform:uppercase;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}.reel .rt.on{opacity:1;transform:none}
.reel .rt small{display:block;font:500 9px var(--mono);letter-spacing:.3em;color:var(--gold);margin-bottom:8px}
.reel .wm{position:absolute;right:10px;bottom:10px;font:500 9px var(--mono);letter-spacing:.25em;color:rgba(255,255,255,.75)}
.pro{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;border:1px dashed var(--gold);background:rgba(255,203,69,.05);color:#fff;font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;margin-top:10px}.pro b{color:var(--gold)}
.cap{border:1px solid var(--line2);padding:14px;color:#cfcfcf;font-size:15px;white-space:pre-line}
.left{font:500 10px var(--mono);letter-spacing:.25em;color:var(--gold);text-align:center;text-transform:uppercase}
/* Planes */
.tog{display:flex;border:1px solid var(--line2);margin:0 0 18px}.tog button{flex:1;height:46px;background:none;border:0;font:500 11px var(--mono);letter-spacing:.25em;text-transform:uppercase;color:#9b9b9b}.tog button.on{background:#fff;color:#000}
.plans{display:grid;gap:12px}
.plan{border:1px solid var(--line2);background:#060606;padding:22px}
.plan.hot{border-color:var(--gold);box-shadow:0 0 40px rgba(255,203,69,.12)}
.plan small{font:500 10px var(--mono);letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
.plan h3{margin:8px 0 4px;font:700 24px var(--sans);text-transform:uppercase}
.plan .pz{font:700 40px/1 var(--sans);margin:12px 0 4px}.plan .pz span{font:500 12px var(--mono);letter-spacing:.2em;color:#9b9b9b}
.plan ul{margin:16px 0 0;padding:0;list-style:none}.plan li{padding:9px 0;border-top:1px solid var(--line);color:#cfcfcf;font-size:15px}.plan li::before{content:"+ ";color:var(--gold)}
.plan .btn{margin-top:18px}
.sim{border:1px solid var(--gold);padding:20px;margin:18px 0}.sim .big b{font-size:26px;white-space:nowrap}
@media (min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}@media (min-width:1200px){.plans{grid-template-columns:repeat(5,1fr)}}
/* Universo IA */
.uni-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;margin:10px 0 0 8px;height:42px;padding:0 18px;border:1px solid var(--gold);background:var(--amber);color:#000;font:700 11px var(--mono);letter-spacing:.3em;text-transform:uppercase}
#uni{position:fixed;inset:0;z-index:60;background:#000;display:none}#uni.on{display:block}
#uni canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#uni .uh{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;z-index:3;display:flex;gap:10px;align-items:center}
#uni .uh input{flex:1;height:46px;background:rgba(0,0,0,.7);border:1px solid var(--line2);color:#fff;padding:0 14px;font:400 16px var(--sans);outline:none}
#uni .uh input:focus{border-color:var(--gold)}
#uni .uh button{height:46px;padding:0 14px;border:1px solid var(--line2);background:rgba(0,0,0,.7);font:500 11px var(--mono);letter-spacing:.3em}
#uni .ut{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 72px);z-index:3;text-align:center;pointer-events:none}
#uni .ut b{display:block;font:700 clamp(22px,6vw,40px)/1 var(--sans);text-transform:uppercase}
#uni .ut span{font:500 10px var(--mono);letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
#uni .cats{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:3;display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
#uni .cats::-webkit-scrollbar{display:none}
#uni .cats button{flex:0 0 auto;height:40px;padding:0 14px;border:1px solid var(--line2);background:rgba(0,0,0,.75);font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#cfcfcf}
#uni .cats button.on{border-color:var(--gold);color:var(--gold)}
#uni .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:3;text-align:center;font:500 10px var(--mono);letter-spacing:.3em;color:#8a8a8a;text-transform:uppercase;pointer-events:none}
.snd3{position:fixed;z-index:25;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:46px;height:46px;border:1px solid var(--gold);background:rgba(0,0,0,.7);color:var(--gold);font-size:18px;display:none}
.snd3.has{display:block}.snd3.off{opacity:.45}
/* Crea tu empleado IA */
.emp{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;margin:10px 0 0 8px;height:42px;padding:0 18px;border:1px solid #fff;background:#fff;color:#000;font:700 11px var(--mono);letter-spacing:.3em;text-transform:uppercase}
.mine{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 156px);max-width:560px;margin:0 auto;z-index:7;display:none;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--gold);background:rgba(0,0,0,.85);font:500 11px/1.5 var(--mono);letter-spacing:.15em}
.mine.on{display:flex}.mine b{color:var(--gold)}.mine button{margin-left:auto;border:1px solid var(--gold);background:none;color:var(--gold);padding:8px 10px;font:500 10px var(--mono);letter-spacing:.2em}
.fld{display:block;margin:0 0 22px}.fld span{display:block;font:500 10px var(--mono);letter-spacing:.35em;color:#9b9b9b;text-transform:uppercase;margin-bottom:10px}
.fld input,.fld select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);color:#fff;font:400 20px var(--sans);padding:6px 0 12px;outline:none;border-radius:0;-webkit-appearance:none;appearance:none}.fld select option{background:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{border:1px solid var(--line2);background:#070707;padding:12px 14px;font:500 11px var(--mono);letter-spacing:.15em;text-transform:uppercase}.chips button.on{border-color:var(--gold);color:var(--gold)}
.rng{width:100%;accent-color:#FFCB45}
.chat{border:1px solid var(--line2);background:#050505;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.chat .m{max-width:84%;padding:12px 14px;font-size:16px;line-height:1.45;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}.chat .m.on{opacity:1;transform:none}
.chat .u{align-self:flex-end;background:#1b1b1b}.chat .a{align-self:flex-start;border:1px solid var(--gold);background:rgba(255,203,69,.06)}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;min-width:0;background:#0b0b0b;border:1px solid var(--line2);color:#fff;font:16px var(--sans,inherit);padding:13px 14px;outline:none}.ask input:focus{border-color:var(--gold)}.ask button{background:var(--gold);color:#000;border:0;font:600 12px var(--mono);letter-spacing:.15em;text-transform:uppercase;padding:0 16px;cursor:pointer}
.chat .a small{display:block;font:500 9px var(--mono);letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 24px}.big div{border:1px solid var(--line2);padding:18px}.big b{display:block;font:700 34px var(--sans);color:var(--gold)}.big span{font:500 10px var(--mono);letter-spacing:.25em;color:#bdbdbd;text-transform:uppercase}
.badge{display:block;width:100%;max-width:420px;margin:0 auto 18px;border:1px solid var(--line2)}
.weeks{border-top:1px solid var(--line2);margin-bottom:20px}.weeks div{display:grid;grid-template-columns:70px 1fr;padding:14px 0;border-bottom:1px solid var(--line2)}.weeks em{font:500 10px var(--mono);letter-spacing:.2em;color:var(--gold);font-style:normal}
/* Viaje cinematográfico IMAGINA */
.imag{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;margin-top:16px;height:42px;padding:0 18px;border:1px solid var(--gold);background:rgba(0,0,0,.5);color:var(--gold);font:500 11px var(--mono);letter-spacing:.32em;text-transform:uppercase}
.imag i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.cine{overflow:hidden!important}
.cine .bg{position:absolute;inset:0;overflow:hidden}
.cine .bg video{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:brightness(.42) contrast(1.15) saturate(1.1);animation:kb2 14s ease-out forwards}
@keyframes kb2{from{transform:scale(1.15) translateY(2%)}to{transform:scale(1)}}
.cine .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 0%,rgba(0,0,0,.75) 100%)}
.cine .bars2::before,.cine .bars2::after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3}
.cine .bars2::before{top:0}.cine .bars2::after{bottom:0}
.cine .ct{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:4;padding:0 26px;max-width:860px;margin:0 auto}
.cine .ch{font:500 10px var(--mono);letter-spacing:.45em;color:var(--gold);text-transform:uppercase;opacity:0;animation:up .9s .3s forwards}
.cine h2{margin:16px 0 0;font:700 clamp(32px,9vw,76px)/.98 var(--sans);text-transform:uppercase}
.cine h2 span{display:inline-block;opacity:0;transform:translateY(40%);animation:up .8s forwards}
.cine p{margin:22px 0 0;color:#d6d6d6;font-size:clamp(17px,4.4vw,22px);max-width:40ch;opacity:0;animation:up 1s 1.4s forwards}
.cine .how{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;opacity:0;animation:up 1s 1.9s forwards}
.cine .how span{border:1px solid var(--line2);padding:8px 10px;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#cfcfcf;background:rgba(0,0,0,.4)}
@keyframes up{to{opacity:1;transform:none}}
.cine .ft{position:absolute;left:0;right:0;bottom:calc(9vh + 16px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 22px}
.cine .ft small{font:500 10px var(--mono);letter-spacing:.35em;color:#9b9b9b}
.cine .nx{height:52px;padding:0 22px;border:1px solid #fff;background:#fff;color:#000;font:700 11px var(--mono);letter-spacing:.3em;text-transform:uppercase}
.cine textarea{width:100%;min-height:110px;margin-top:22px;background:rgba(0,0,0,.6);border:1px solid var(--line2);color:#fff;font:400 18px var(--sans);padding:16px;resize:none;outline:none;opacity:0;animation:up 1s 1.6s forwards}
.cine textarea:focus{border-color:var(--gold)}
/* Vídeo explicativo animado */
.exp{position:relative;height:min(68vh,560px);border:1px solid var(--line2);overflow:hidden;background:#000;margin-bottom:18px}
.exp video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.28) contrast(1.1)}
.exp .bars{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:6px;z-index:3}.exp .bars i{flex:1;height:2px;background:rgba(255,255,255,.2);overflow:hidden}.exp .bars i b{display:block;height:100%;width:0;background:var(--gold)}
.exp .sc{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:40px 22px;opacity:0;transform:translateY(16px) scale(.98);transition:opacity .6s,transform .6s}
.exp .sc.on{opacity:1;transform:none}
.exp .sc small{font:500 10px var(--mono);letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
.exp .sc h4{margin:10px 0 30px;font:700 clamp(20px,5vw,30px)/1.15 var(--sans);text-transform:uppercase}
.flow{display:flex;align-items:center;gap:0}
.flow .nd{flex:0 0 auto;min-width:0;max-width:30%;padding:12px 10px;border:1px solid var(--line2);background:rgba(0,0,0,.6);font:500 10px/1.3 var(--mono);letter-spacing:.15em;text-transform:uppercase;text-align:center;opacity:0;transform:scale(.8);transition:opacity .5s,transform .5s,border-color .5s}
.exp .sc.on .nd{opacity:1;transform:none}.exp .sc.on .nd.hl{border-color:var(--gold);color:var(--gold);box-shadow:0 0 30px rgba(255,203,69,.25)}
.flow .ln{position:relative;flex:1;height:1px;background:var(--line2);min-width:14px}
.flow .ln::after{content:"";position:absolute;top:-3px;left:0;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:dot 1.4s linear infinite}
@keyframes dot{to{left:calc(100% - 7px)}}
.exp .nav{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr}.exp .nav button{background:none;border:0}
.exp .pp{position:absolute;right:14px;bottom:14px;z-index:5;height:40px;padding:0 14px;border:1px solid var(--line2);background:rgba(0,0,0,.6);font:500 10px var(--mono);letter-spacing:.3em}
/* Galería */
